name: Seasonal page readiness

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check upcoming calendar and sowing pages on menesseja.lv
        run: node scripts/check-seasonal-seo.mjs
